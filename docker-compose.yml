# =============================================================================
# MaxKB MCP Server — 双服务统一编排
# -----------------------------------------------------------------------------
# 所有可变配置均从同目录的 .env 读取, 请勿在本文件里写死任何凭据。
#
#   cp .env.example .env        # 首次部署: 复制模板
#   vim .env                    # 填入 MaxKB 地址与凭据
#   docker compose up -d --build
#
# 只想启动其中一个服务:
#   docker compose up -d --build chat          # 仅智能体对话
#   docker compose up -d --build knowledge     # 仅知识库管理
#
# .env 已被 .gitignore 忽略, 严禁提交到 Git 仓库。
# =============================================================================
services:
  # ---------------------------------------------------------------------------
  # 服务 1: 智能体对话 MCP 服务器
  #   工具: maxkb_chat (名称可通过 CHAT_TOOL_NAME 定制)
  #   端点: /mcp (Streamable HTTP) | /sse (SSE) | /health
  # ---------------------------------------------------------------------------
  chat:
    build:
      context: ./maxkb-chat-mcp
      args:
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.tuna.tsinghua.edu.cn/simple}
    image: maxkb-mcp-chat:1.0.0
    container_name: maxkbv2-mcp-app
    ports:
      - "${CHAT_PORT:-18010}:8000"
    environment:
      # ---- 必填, 见 .env.example ----
      BASE_URL: ${MAXKB_BASE_URL:-}
      API_KEY: ${CHAT_API_KEY:-}
      # ---- 可选, 留空则由程序使用内置默认值 ----
      SERVER_NAME: ${CHAT_SERVER_NAME:-}
      TOOL_NAME: ${CHAT_TOOL_NAME:-}
      TOOL_DESCRIPTION: ${CHAT_TOOL_DESCRIPTION:-}
      MAXKB_CHAT_PREFIX: ${MAXKB_CHAT_PREFIX:-}
      MAXKB_TIMEOUT: ${CHAT_TIMEOUT:-}
      MCP_AUTH_TOKEN: ${MCP_AUTH_TOKEN:-}
      MCP_ALLOWED_HOSTS: ${MCP_ALLOWED_HOSTS:-}
      HOST: 0.0.0.0
      PORT: 8000
    restart: always
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ---------------------------------------------------------------------------
  # 服务 2: 知识库管理 MCP 服务器
  #   工具: list_agents / list_knowledge_bases / list_documents /
  #         add_segment / upload_document / search_knowledge
  #   端点: /mcp (Streamable HTTP) | /sse (SSE) | /health
  # ---------------------------------------------------------------------------
  knowledge:
    build:
      context: ./maxkb-knowledge-mcp
      args:
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.tuna.tsinghua.edu.cn/simple}
    image: maxkb-mcp-knowledge:1.0.0
    container_name: maxkbv2-knowledge-mcp-app
    ports:
      - "${KB_PORT:-18011}:8000"
    environment:
      # ---- 必填 ----
      BASE_URL: ${MAXKB_BASE_URL:-}
      # ---- 凭据二选一: 优先 KB_API_KEY, 未填则用账号密码登录 ----
      MAXKB_API_KEY: ${KB_API_KEY:-}
      MAXKB_USERNAME: ${KB_USERNAME:-}
      MAXKB_PASSWORD: ${KB_PASSWORD:-}
      # ---- 可选 ----
      MAXKB_WORKSPACE_ID: ${KB_WORKSPACE_ID:-}
      MAXKB_KNOWLEDGE_ID: ${KB_KNOWLEDGE_ID:-}
      SERVER_NAME: ${KB_SERVER_NAME:-}
      MAXKB_TOP_NUMBER: ${KB_TOP_NUMBER:-}
      MAXKB_SIMILARITY: ${KB_SIMILARITY:-}
      MAXKB_SEARCH_MODE: ${KB_SEARCH_MODE:-}
      MAXKB_ADMIN_PREFIX: ${MAXKB_ADMIN_PREFIX:-}
      MAXKB_TIMEOUT: ${KB_TIMEOUT:-}
      MCP_AUTH_TOKEN: ${MCP_AUTH_TOKEN:-}
      MCP_ALLOWED_HOSTS: ${MCP_ALLOWED_HOSTS:-}
      HOST: 0.0.0.0
      PORT: 8000
    restart: always
    volumes:
      # upload_document 工具的 file_path 以 /app/data 开头; 宿主目录自动创建
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
