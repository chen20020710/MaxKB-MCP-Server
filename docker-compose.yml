# =============================================================================
# MaxKB MCP Server — unified compose for both services
# -----------------------------------------------------------------------------
# All configurable values come from the .env file next to this one.
# Never hard-code credentials in this file.
#
#   cp .env.example .env        # first deploy: copy the template
#   edit .env                   # fill in MaxKB URL and credentials
#   docker compose up -d --build
#
# Start only one service:
#   docker compose up -d --build chat          # agent chat only
#   docker compose up -d --build knowledge     # knowledge base only
#
# .env is git-ignored — never commit it.
# =============================================================================
services:
  # ---------------------------------------------------------------------------
  # Service 1: agent chat MCP server
  #   Tools: maxkb_chat (+ one tool per extra entry in CHAT_AGENTS)
  #   Endpoints: /mcp (Streamable HTTP) | /sse (SSE) | /health
  # ---------------------------------------------------------------------------
  chat:
    build:
      context: ./maxkb-chat-mcp
      args:
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.tuna.tsinghua.edu.cn/simple}
    image: maxkb-mcp-chat:2.0.0
    container_name: maxkbv2-mcp-app
    ports:
      - "${CHAT_PORT:-18010}:8000"
    environment:
      # ---- required, see .env.example ----
      BASE_URL: ${MAXKB_BASE_URL:-}
      API_KEY: ${CHAT_API_KEY:-}
      # ---- optional: multiple agents in one process ----
      CHAT_AGENTS: ${CHAT_AGENTS:-}
      # ---- optional: empty value = program built-in default ----
      SERVER_NAME: ${CHAT_SERVER_NAME:-}
      TOOL_NAME: ${CHAT_TOOL_NAME:-}
      TOOL_DESCRIPTION: ${CHAT_TOOL_DESCRIPTION:-}
      MAXKB_CHAT_PREFIX: ${MAXKB_CHAT_PREFIX:-}
      MAXKB_TIMEOUT: ${CHAT_TIMEOUT:-}
      MCP_AUTH_TOKEN: ${MCP_AUTH_TOKEN:-}
      MCP_ALLOWED_HOSTS: ${MCP_ALLOWED_HOSTS:-}
      HOST: 0.0.0.0
      PORT: 8000
    restart: always
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ---------------------------------------------------------------------------
  # Service 2: knowledge base MCP server
  #   Tools: list_knowledge_bases / list_documents / add_segment /
  #          upload_document / search_knowledge / get_segment_context
  #   Endpoints: /mcp (Streamable HTTP) | /sse (SSE) | /health
  # ---------------------------------------------------------------------------
  knowledge:
    build:
      context: ./maxkb-knowledge-mcp
      args:
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.tuna.tsinghua.edu.cn/simple}
    image: maxkb-mcp-knowledge:2.0.0
    container_name: maxkbv2-knowledge-mcp-app
    ports:
      - "${KB_PORT:-18011}:8000"
    environment:
      # ---- required ----
      BASE_URL: ${MAXKB_BASE_URL:-}
      # ---- credential: either KB_API_KEY (preferred) or username/password ----
      MAXKB_API_KEY: ${KB_API_KEY:-}
      MAXKB_USERNAME: ${KB_USERNAME:-}
      MAXKB_PASSWORD: ${KB_PASSWORD:-}
      # ---- optional ----
      MAXKB_WORKSPACE_ID: ${KB_WORKSPACE_ID:-}
      MAXKB_KNOWLEDGE_ID: ${KB_KNOWLEDGE_ID:-}
      SERVER_NAME: ${KB_SERVER_NAME:-}
      MAXKB_TOP_NUMBER: ${KB_TOP_NUMBER:-}
      MAXKB_SIMILARITY: ${KB_SIMILARITY:-}
      MAXKB_SEARCH_MODE: ${KB_SEARCH_MODE:-}
      MAXKB_CONTEXT_NEIGHBORS: ${KB_CONTEXT_NEIGHBORS:-}
      MAXKB_CONTEXT_MAX_CHARS: ${KB_CONTEXT_MAX_CHARS:-}
      MAXKB_ADMIN_PREFIX: ${MAXKB_ADMIN_PREFIX:-}
      MAXKB_TIMEOUT: ${KB_TIMEOUT:-}
      MCP_AUTH_TOKEN: ${MCP_AUTH_TOKEN:-}
      MCP_ALLOWED_HOSTS: ${MCP_ALLOWED_HOSTS:-}
      HOST: 0.0.0.0
      PORT: 8000
    restart: always
    volumes:
      # upload_document's file_path starts with /app/data; host dir auto-created
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
